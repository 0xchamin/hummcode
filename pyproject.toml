[project]
name = "hummcode"
version = "0.1.0"
description = "The hummingbird coding agent - minimalist, powerful, model-agnostic, and composable."
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.83.0",    # Forcing version 1.83.0+ to avoid the compromised 1.82.7/1.82.8 versions
    "langfuse<3.0.0",     # Pinning to v2 to maintain LiteLLM compatibility
    "python-dotenv",      # For loading our .env secrets
    "pydantic",           
    "textual",            
]


[project.scripts]
hummcode = "hummcode.core:main"